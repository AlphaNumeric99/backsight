[package]
name = "backsight"
description = "Backsight — a desktop viewer for Tapo cameras"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "backsight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Application code, not a published API — and on Windows `tauri-build` adds its
# static-CRT shim directory to the link search path, which breaks the workspace's
# merged doctest binary. See the `--exclude backsight` note in CONTRIBUTING.md.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
bytes.workspace = true
getrandom = "0.4"
hex = "0.4"
jiff = "0.2"
keyring = { version = "4.2", features = ["v1"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
tapo-camera.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing.workspace = true
tracing-subscriber.workspace = true
webpki-roots = "0.26"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[dev-dependencies]
bytes.workspace = true

[lints]
workspace = true
