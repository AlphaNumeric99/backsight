[package]
name = "tapo-mock"
description = "A fake Tapo camera (control API and media stream) for tests and UI development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "tapo-mock"
path = "src/main.rs"

[dependencies]
aes = "0.9"
anyhow.workspace = true
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc"] }
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
hex = "0.4"
jiff = "0.2"
md-5 = "0.11"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
sha2 = "0.11"
tokio = { workspace = true, features = ["fs", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tapo-camera.workspace = true

[lints]
workspace = true

