[package]
name = "tapo-camera"
description = "Unofficial client for TP-Link Tapo cameras: local control API, SD-card recordings and media streams (a Rust port of pytapo)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["tapo", "tp-link", "camera", "nvr", "mpeg-ts"]
categories = ["api-bindings", "multimedia::video", "network-programming"]
# Backsight ships as an application, not as crates. Use it from this repository with a git
# dependency. The metadata above stays for `cargo doc` and for anyone vendoring the crate.
publish = false

[dependencies]
aes = "0.9"
base64 = "0.23"
bytes.workspace = true
cbc = { version = "0.2", features = ["alloc"] }
crc32fast = "1.5"
getrandom = "0.4"
hex = "0.4"
if-addrs = "0.15"
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
secrecy = "0.10"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
# Calendar-versioned; minor releases may change box structs, so stay on 2026.3.x.
shiguredo_mp4 = "~2026.3"
tempfile = "3.10"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
keyring = { version = "4.2", features = ["v1"] }
rpassword = "7"
tokio = { workspace = true, features = ["fs"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
